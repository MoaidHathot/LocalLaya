# Unit tests only: they need no model bundle and no GPU (the router is exercised with fake lanes).
# test/router.test.mjs and test/sidecar.test.mjs need the 1.7 GB model + a WebGPU-capable GPU and run locally
# (npm run test:router / npm run test:sidecar).
name: unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      # onnxruntime-node's postinstall would otherwise try to fetch optional (CUDA) binaries; the CPU EP is bundled
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: syntax check every module
        run: node -e "const fs=require('node:fs');for(const d of ['.','src','data','experiments','test','skills/laya-decisions/scripts'])for(const f of fs.readdirSync(d))if(f.endsWith('.mjs'))require('node:child_process').execFileSync(process.execPath,['--check',d+'/'+f],{stdio:'inherit'})"
      - run: npm test
